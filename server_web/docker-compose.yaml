services:
  # --- Serveur Web Nginx (React uniquement) ---
  web:
    image: nginx:alpine
    container_name: nginx-react
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../my-app/dist:/var/www/html/my-app:ro

  # --- Serveur DNS Bind9 ---
  bind:
    build: ./bind
    container_name: bind9-service
    restart: always
    ports:
      - "53:53/udp"
      - "53:53/tcp"


services:
  web:
    image: nginx:alpine
    container_name: nginx-react
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../my-app/dist:/var/www/html/my-app:ro
    depends_on:
      - api

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: express-api
    restart: always
    env_file:
      - ../server/.env
    expose:
      - "3000"

  bind:
    build: ./bind
    container_name: bind9-service
    restart: always
    ports:
      - "53:53/udp"
      - "53:53/tcp"

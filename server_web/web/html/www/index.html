<!DOCTYPE html>
<html lang="en">
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>test</title>
  <link href="style.css" rel="stylesheet" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serveur Web - Groupe L1-4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Fond sombre moderne */
            color: #f8fafc; /* Texte clair */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 90%;
        }

        .status {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981; /* Vert émeraude */
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Animation du petit point vert */
        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 1rem 0;
            font-weight: 900;
            letter-spacing: -1px;
        }

        /* Effet dégradé sur le nom du groupe */
        .highlight {
            background: linear-gradient(to right, #3b82f6, #8b5cf6); /* Bleu vers Violet */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        strong {
            color: #e2e8f0;
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Badges pour les technos */
        .badge {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 700;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
        }

        .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
  <script>
  </script>
    <div class="container">
        <div class="status">
            <span class="dot"></span> Serveur En Ligne
        </div>
        
        <h1>Groupe <span class="highlight">L1-4</span></h1>
        
        <p>Bienvenue sur notre infrastructure web. Ce site est fièrement hébergé et propulsé par <strong>Docker</strong> et <strong>Nginx</strong> pour le TP d'Admin II.</p>
        
        <div class="tech-stack">
            <span class="badge">Nginx</span>
            <span class="badge">Docker</span>
            <span class="badge">DNS Bind9</span>
            <span class="badge">Debian VPS</span>
        </div>
    </div>
</body>
</html>

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name app.python-gentil.ephec-ti.be;
        
        root /var/www/html/my-app;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

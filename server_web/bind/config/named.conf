options {
    directory "/var/cache/bind";

    version "not currently available";

    listen-on-v6 { any; };
    allow-query { any; };
    allow-query-cache { none; };

    recursion no;

    dnssec-validation auto;
};

zone "python-gentil.ephec-ti.be." {
    type master;
    file "/var/cache/bind/python-gentil.ephec-ti.be.zone";

    allow-transfer { none; };

    inline-signing yes;
    dnssec-policy default;
};
